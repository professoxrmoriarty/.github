name: "🐞 Bug Report"
description: "Report a reproducible problem"
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in as much detail as possible so we can reproduce it quickly.

        > ⚠️ Do NOT report security vulnerabilities here; please use private disclosure instead (see SECURITY.md).
  - type: dropdown
    id: project
    attributes:
      label: Project
      description: Which project is affected?
      options:
        - Yaklang (language & engine)
        - Yakit (platform)
        - Memfit AI
        - HackSkills / HackBenchmark / RedHaze
        - Docs & Website
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the bug and what you expected.
      placeholder: I executed..., and the result was..., but I expected...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce; please attach redacted scripts/request packets if available.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, version, etc.
      value: |
        - OS: (macOS / Linux / Windows)
        - Yak / Yakit Version (yak version):
        - Install method:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste relevant logs or screenshots (redacted).
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
