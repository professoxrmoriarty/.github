name: "✨ Feature Request"
description: "Suggest a new feature or improvement"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please help us understand the real scenario behind the request.
  - type: dropdown
    id: project
    attributes:
      label: Project
      options:
        - Yaklang (language & engine)
        - Yakit (platform)
        - Memfit AI
        - HackSkills / HackBenchmark / RedHaze
        - Docs & Website
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What problem are you trying to solve?
      placeholder: When I..., I want to be able to..., but currently...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches or workarounds you considered.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
