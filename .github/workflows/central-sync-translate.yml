name: "Central Sync & Progressive Override"

on:
  workflow_call:
    inputs:
      force_release:
        description: '၁၀၀% မပြီးသေးလည်း Release အတင်းထုတ်မည်လား?'
        type: string
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

env:
  TARGET_BRANCH: "english-edition"
  YAKIT_FORK_REPO: "https://github.com/professoxrmoriarty/yakit.git"
  YAKLANG_FORK_REPO: "https://github.com/professoxrmoriarty/yaklang.git"
  YTRAY_FORK_REPO: "https://github.com/professoxrmoriarty/ytray.git"

jobs:
  sync-translate:
    name: "Sync, Count & Override"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: "2. Sync Upstream Diffs"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # github.repository ဥပမာ 'professoxrmoriarty/yakit' မှ 'yakit' ကိုသာ ဖြတ်ယူမည်
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          UPSTREAM_URL="https://github.com/yaklang/${REPO_NAME}.git"

          mkdir -p /tmp/backup/workflows
          cp -r .github/workflows/* /tmp/backup/workflows/ 2>/dev/null || true
          [ -f ".i18n_cache.json" ] && cp .i18n_cache.json /tmp/backup/

          git remote add upstream "${UPSTREAM_URL}" 2>/dev/null || git remote set-url upstream "${UPSTREAM_URL}"
          git fetch upstream main --tags || git fetch upstream master --tags
          UP_REF="upstream/main"
          git rev-parse --verify "$UP_REF" >/dev/null 2>&1 || UP_REF="upstream/master"

          git checkout -B "${{ env.TARGET_BRANCH }}" "origin/${{ env.TARGET_BRANCH }}" 2>/dev/null || git checkout -B "${{ env.TARGET_BRANCH }}" "$UP_REF"

          if ! git merge "$UP_REF" -X theirs --allow-unrelated-histories --no-edit; then
            git status --porcelain | awk '$1=="DU" || $1=="UD" {print $2}' | xargs -r git rm -f
            git checkout --theirs . || true
            git add -A; git commit --no-edit || true
          fi

          rm -rf .github/workflows/*; mkdir -p .github/workflows
          cp /tmp/backup/workflows/1-sync-translate.yml .github/workflows/ 2>/dev/null || true
          cp /tmp/backup/workflows/2-build-release.yml .github/workflows/ 2>/dev/null || true
          cp /tmp/backup/workflows/release-en.yml .github/workflows/ 2>/dev/null || true
          [ -f "/tmp/backup/.i18n_cache.json" ] && cp /tmp/backup/.i18n_cache.json .

          for FORK in "${{ env.YAKIT_FORK_REPO }}" "${{ env.YAKLANG_FORK_REPO }}" "${{ env.YTRAY_FORK_REPO }}"; do
            NAME=$(basename "$FORK" .git)
            git clone --depth 1 --branch english-edition "$FORK" "/tmp/${NAME}_fork" 2>/dev/null || true
            [ -f "/tmp/${NAME}_fork/.i18n_cache.json" ] && cp "/tmp/${NAME}_fork/.i18n_cache.json" "/tmp/${NAME}_cache.json"
            rm -rf "/tmp/${NAME}_fork"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g typescript
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --upgrade pip deep-translator PyYAML

      - name: "3. Statistics & Translation Override"
        id: translate
        run: |
          python3 - << 'EOF'
          import os, re, json, time, yaml
          from deep_translator import GoogleTranslator
          CACHE_FILE = ".i18n_cache.json"
          START_TIME = time.time()
          translator = GoogleTranslator(source='zh-CN', target='en')
          zh_char_re = re.compile(r'[\u4e00-\u9fff]')
          def has_zh(text): return bool(zh_char_re.search(str(text)))
          def count_zh_chars(text): return len(zh_char_re.findall(str(text)))
          
          def safe_load_json(filepath):
              if not os.path.exists(filepath): return {}
              try:
                  with open(filepath, 'r', encoding='utf-8') as f: return json.loads(f.read())
              except:
                  try:
                      with open(filepath, 'r', encoding='utf-8') as f: return json.loads(re.sub(r',\s*([}\]])', r'\1', f.read()))
                  except: return {}

          cache = {}
          for cf in ("/tmp/yaklang_cache.json", "/tmp/yakit_cache.json", "/tmp/ytray_cache.json", CACHE_FILE):
              cache.update(safe_load_json(cf))

          # Bash Script များမှ စာသားများကိုပါ တိကျစွာ ဖမ်းယူနိုင်ရန် Pattern ကို တိုးချဲ့ထားပါသည်
          TOKEN_RE = re.compile(
              r'(//[^\n]*|/\*[\s\S]*?\*/|<!--[\s\S]*?-->|#[^\n]*)'  # 1: Comments (Bash ၏ # အပါအဝင်)
              r'|(`[^`]*`)'                                        # 2: Backtick strings
              r'|("(?:\\.|[^"\\\n])*")'                            # 3: Double quote strings (Bash echo/die များ)
              r"|('(?:\\.|[^'\\\n])*')"                            # 4: Single quote strings
              r'|(>[^<>{}`"\']*?[\u4e00-\u9fff]+[^<>{}`"\']*?<)'   # 5: XML/JSX text
          )          source_files, md_files, yaml_files = [], [], []
          zh_strings = set()
          IGNORE_DIRS = {".git", ".github", "node_modules", "dist", "out", "vendor", "build", "assets"}
          IGNORE_STRINGS = {"微软雅黑", "宋体", "黑体", "苹方", "楷体", "仿宋", "Microsoft YaHei", "PingFang SC"}

          total_files = total_lines = total_zh_chars = 0
          TARGET_EXTS = ('.go', '.ts', '.tsx', '.js', '.jsx', '.py', '.json', '.yaml', '.yml', '.md', '.txt', '.cs', '.xaml', '.swift', '.sf', '.sh')
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in IGNORE_DIRS and not d.endswith('Tests')]
              for file in files:
                  if "Test" in file or "test" in file or file.endswith('.d.ts'): continue
                  p = os.path.join(root, file)
                  if file.endswith(TARGET_EXTS):
                      try:
                          with open(p, 'r', encoding='utf-8') as f: c = f.read()
                          if not has_zh(c): continue
                          
                          total_files += 1
                          lines = c.splitlines()
                          for ln in lines:
                              if has_zh(ln):
                                  total_lines += 1; total_zh_chars += count_zh_chars(ln)
                          
                          if file.endswith(('.md', '.txt')):
                              for ln in lines:
                                  if has_zh(ln) and not ln.strip().startswith("```") and len(ln) <= 500: zh_strings.add(ln.strip())
                              md_files.append((p, c))
                          elif file.endswith(('.yaml', '.yml')):
                              data = yaml.safe_load(c)
                              if isinstance(data, dict):
                                  for k in ['name', 'description', 'solution', 'title', 'summary', 'author', 'help']:
                                      v = data.get(k)
                                      if isinstance(v, str) and has_zh(v): zh_strings.add(v)
                                  if isinstance(data.get('info'), dict):
                                      for k in ['name', 'description', 'solution', 'summary']:
                                          v = data['info'].get(k)
                                          if isinstance(v, str) and has_zh(v): zh_strings.add(v)
                              yaml_files.append((p, c))
                          else:
                              is_xml = file.endswith('.xaml')
                              is_tsx = file.endswith('.tsx')
                              is_go = file.endswith('.go')
                              for m in TOKEN_RE.finditer(c):
                                  comment, special, dq, sq, xml_s = m.groups()
                                  if comment or special: continue
                                  tok = dq or (sq if not is_go else None)
                                  if tok and has_zh(tok):
                                      inner = tok[1:-1]
                                      if inner.strip() not in IGNORE_STRINGS and len(inner) <= 500: zh_strings.add(inner)
                                  elif (is_xml or is_tsx) and xml_s and has_zh(xml_s):
                                      inner = xml_s[1:-1].strip()
                                      if inner and inner not in IGNORE_STRINGS and len(inner) <= 500: zh_strings.add(inner)
                              source_files.append((p, c))
                      except: pass

          uncached = [s for s in zh_strings if s not in cache or has_zh(cache.get(s, ""))]
          print(f"Total Files: {total_files} | Total Lines: {total_lines} | Total Chars: {total_zh_chars} | New to translate: {len(uncached)}")

          failures, limit_reached = 0, False
          for idx, s in enumerate(uncached):
              if time.time() - START_TIME > 45 * 60 or failures >= 5: limit_reached = True; break
              try:
                  res = translator.translate(s)
                  if res and not has_zh(res): cache[s] = res; failures = 0
                  else: failures += 1
              except: failures += 1; time.sleep(1.5)
              if (idx + 1) % 30 == 0: 
                  with open(CACHE_FILE, 'w', encoding='utf-8') as f: json.dump(cache, f, ensure_ascii=False, indent=2)
                  time.sleep(0.4)

          with open(CACHE_FILE, 'w', encoding='utf-8') as f: json.dump(cache, f, ensure_ascii=False, indent=2)

          def sanitize_for_quote(text, q):
              text = text.replace('\r', ' ').replace('\n', ' ')
              if q == "'": text = text.replace("\\'", "'").replace("'", "\\'")
              elif q == '"': text = text.replace('\\"', '"').replace('"', '\\"')
              elif q == '`': text = text.replace('`', "'").replace('${', '\\${')
              return text

          for p, c in md_files:
              try:
                  out = []
                  for ln in c.splitlines():
                      st = ln.strip()
                      out.append(ln.replace(st, cache[st], 1) if st in cache and not has_zh(cache[st]) else ln)
                  nc = "\n".join(out) + "\n"
                  if nc != c:
                      with open(p, 'w', encoding='utf-8') as f: f.write(nc)
              except: pass

          for p, c in source_files:
              try:
                  is_xml = p.endswith('.xaml')
                  is_tsx = p.endswith('.tsx')
                  is_go = p.endswith('.go')
                  is_sh = p.endswith('.sh') # Bash ဖိုင်ဟုတ်မဟုတ် စစ်ဆေးခြင်း
                  def repl(m):
                      comment, special, dq, sq, xml_s = m.groups()
                      # Bash ဖိုင်ဆိုလျှင် # comment ထဲက စာသားကိုပါ ဘာသာပြန်စေချင်လျှင် ဤနေရာတွင် စစ်ဆေးနိုင်သည် (လောလောဆယ် Code String ကိုသာ ပြန်ပါမည်)
                      if comment and not (is_sh and has_zh(comment)): return m.group(0)
                      
                      tok = dq or (sq if not is_go else None) or special
                      if tok:
                          if not has_zh(tok): return tok
                          q, inner = tok[0], tok[1:-1]
                          if inner.strip() in IGNORE_STRINGS or inner not in cache or has_zh(cache[inner]): return tok
                          return f"{q}{sanitize_for_quote(cache[inner], q)}{q}"
                      if (is_xml or is_tsx) and xml_s and has_zh(xml_s):
                          inner_raw = xml_s[1:-1]
                          inner_stripped = inner_raw.strip()
                          if not inner_stripped or inner_stripped not in cache or has_zh(cache[inner_stripped]): return xml_s
                          trans = cache[inner_stripped].replace('<', '&lt;').replace('>', '&gt;')
                          lead = inner_raw[:len(inner_raw) - len(inner_raw.lstrip())]
                          trail = inner_raw[len(inner_raw.rstrip()):]
                          return f">{lead}{trans}{trail}<"
                      return m.group(0)
                  
                  nc = TOKEN_RE.sub(repl, c)
                  if nc != c:
                      with open(p, 'w', encoding='utf-8') as f: f.write(nc)
              except: pass
          
          for p, c in yaml_files:
              try:
                  data = yaml.safe_load(c)
                  mod = False
                  for k in ['name', 'description', 'solution', 'title', 'summary', 'author', 'help']:
                      v = data.get(k)
                      if isinstance(v, str) and v in cache and not has_zh(cache[v]): data[k] = cache[v]; mod = True
                  if isinstance(data.get('info'), dict):
                      for k in ['name', 'description', 'solution', 'summary']:
                          v = data['info'].get(k)
                          if isinstance(v, str) and v in cache and not has_zh(cache[v]): data['info'][k] = cache[v]; mod = True
                  if mod:
                      with open(p, 'w', encoding='utf-8') as f: yaml.safe_dump(data, f, allow_unicode=False, sort_keys=False)
              except: pass

          remaining = [s for s in zh_strings if s not in cache or has_zh(cache.get(s, ""))]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"is_complete={'true' if (len(remaining) == 0 and not limit_reached) else 'false'}\n")
              f.write(f"remaining_count={len(remaining)}\n")
          EOF

      - name: "4. Syntax Check & Auto-Revert"
        run: |
          for f in $(git ls-files --modified '*.go'); do
            if [ -f "$f" ] && ! gofmt -e "$f" >/dev/null 2>&1; then git checkout HEAD -- "$f" 2>/dev/null || true; fi
          done
          node - << 'EOF'
          const fs = require("fs"); const { execFileSync } = require("child_process");
          let ts; try { ts = require("typescript"); } catch(e) { process.exit(0); }
          function walk(dir, list = []) {
            if (!fs.existsSync(dir)) return list;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === "node_modules" || entry.name === "dist") continue;
              const full = dir + "/" + entry.name;
              if (entry.isDirectory()) walk(full, list);
              else if (entry.name.endsWith(".ts") || entry.name.endsWith(".tsx")) list.push(full);
            }
            return list;
          }
          for (const f of walk(".")) {
            try {
              const sf = ts.createSourceFile(f, fs.readFileSync(f, "utf8"), 99, true, f.endsWith(".tsx") ? 4 : 3);
              if (sf.parseDiagnostics && sf.parseDiagnostics.length > 0) execFileSync("git", ["checkout", "HEAD", "--", f]);
            } catch(e) {}
          }
          EOF

      - name: "5. Commit Progress & Trigger Release"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            if [ "${{ steps.translate.outputs.is_complete }}" == "true" ]; then
              git commit -m "feat(i18n): 100% translated source files to English"
            else
              git commit -m "chore(i18n): progressive source override (${{ steps.translate.outputs.remaining_count }} left) [skip ci]"
            fi
            git push origin HEAD:refs/heads/${{ env.TARGET_BRANCH }} --force
          fi

          if [ "${{ steps.translate.outputs.is_complete }}" == "true" ] || [ "${{ inputs.force_release }}" == "true" ]; then
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            EN_TAG="v$(date +'%Y.%m.%d')-${REPO_NAME}-en"
            git tag -f "${EN_TAG}" HEAD
            git push origin "refs/tags/${EN_TAG}" --force
            gh workflow run 2-build-release.yml --ref "${{ env.TARGET_BRANCH }}" -f tag_name="${EN_TAG}" || true
          fi
